<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeyVault</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <div class="lock-icon" aria-hidden="true">🔒</div>
      <div>
        <div class="title">KeyVault</div>
        <div class="subtitle">Your Personal API Key Store</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-local">Local Database</span>
      <span class="divider">•</span>
      <span id="status-version">v1.0.0</span>
    </div>
    <button class="btn" id="sidebar-toggle" aria-label="Toggle sidebar" style="display:none;">☰</button>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <nav>
        <a data-view="keys" href="#/keys"><span class="icon">🔑</span> Keys</a>
        <a data-view="providers" href="#/providers"><span class="icon">📦</span> Providers</a>
        <a data-view="settings" href="#/settings"><span class="icon">⚙</span> Settings</a>
        <a data-view="about" href="#/about"><span class="icon">ℹ</span> About</a>
      </nav>
      <div class="sidebar-status" id="sidebar-status">
        <div class="status-card">
          <span class="status-icon" id="sidebar-status-icon">✓</span>
          <span class="status-text">
            <strong id="sidebar-status-label">Database Ready</strong><br>
            <span id="sidebar-status-detail">SQLite &bull; Encrypted</span>
          </span>
        </div>
      </div>
    </aside>

    <main id="main">
      <div id="content">
        <div id="view-root"></div>
      </div>
    </main>
  </div>

  <div id="overlay-backdrop" class="overlay-backdrop" hidden>
    <div class="overlay-card" role="dialog" aria-modal="true">
      <h1 id="overlay-title">Unlock KeyVault</h1>
      <p class="sub" id="overlay-sub">Enter your master password to continue.</p>
      <div id="overlay-row"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
