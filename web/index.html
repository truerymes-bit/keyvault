<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeyVault</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <div class="logo">🔐</div>
      <div>
        <div class="title">KeyVault</div>
        <div class="subtitle">Your Personal API Key Store</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="status">
      <span class="dot"></span>
      <span id="status-label">Database not connected yet</span>
      <span id="status-version">v1.0.0</span>
    </div>
    <button class="btn" id="sidebar-toggle" aria-label="Toggle sidebar" style="display:none;">☰</button>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <div class="brand-row">
        <div class="logo">🔐</div>
        <div class="title" style="font-weight:700; font-size:14px;">KeyVault</div>
      </div>
      <nav>
        <a data-view="dashboard" href="#/dashboard"><span class="icon">▣</span> Dashboard</a>
        <a data-view="keys" href="#/keys"><span class="icon">🔑</span> API Keys</a>
        <a data-view="providers" href="#/providers"><span class="icon">📦</span> Providers</a>
        <a data-view="add-key" href="#/keys/new"><span class="icon">＋</span> Add Key</a>
        <a data-view="import" href="#/import"><span class="icon">📥</span> Import</a>
        <a data-view="settings" href="#/settings"><span class="icon">⚙</span> Settings</a>
      </nav>
      <footer>
        <span id="db-status">Database Ready &nbsp;·&nbsp; SQLite &nbsp;·&nbsp; Encrypted</span>
      </footer>
    </aside>

    <main id="main">
      <div id="view-root"></div>
    </main>
  </div>

  <div id="overlay-backdrop" class="overlay-backdrop" hidden>
    <div class="overlay-card" role="dialog" aria-modal="true">
      <h1 id="overlay-title">Unlock KeyVault</h1>
      <p class="sub" id="overlay-sub">Enter your master password to continue.</p>
      <div class="field">
        <label for="overlay-password">Master password</label>
        <input type="password" id="overlay-password" autocomplete="current-password" spellcheck="false">
      </div>
      <div class="footer">
        <button class="btn" id="overlay-cancel">Cancel</button>
        <button class="btn primary" id="overlay-unlock">Unlock</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script src="/js/app.js"></script>
</body>
</html>
